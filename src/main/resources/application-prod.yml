spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shopdb}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false

flyway:
  enabled: true

logging:
  level:
    root: WARN
    com.assignment.shop: INFO

